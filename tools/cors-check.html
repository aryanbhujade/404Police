<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 Police — CORS check</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 0; padding: 24px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; opacity: .7; }
  button { font: inherit; padding: 8px 16px; cursor: pointer; margin-right: 8px; }
  #summary { margin: 18px 0; padding: 12px; border: 1px solid currentColor; border-radius: 6px; }
  #summary strong { display: inline-block; min-width: 3ch; }
  table { border-collapse: collapse; width: 100%; margin-top: 16px; }
  th, td { text-align: left; padding: 4px 10px 4px 0; border-bottom: 1px solid rgba(128,128,128,.25); vertical-align: top; }
  th { position: sticky; top: 0; background: Canvas; }
  .ok { color: #12805c; } .bad { color: #c0392b; } .warn { color: #b7791f; }
  td.reason { opacity: .75; font-size: 12px; max-width: 46ch; }
  textarea { width: 100%; height: 190px; margin-top: 16px; font: inherit; }
</style>
</head>
<body>

<h1>404 Police — CORS check</h1>
<p class="sub">
  Probes every endpoint in <code>services.json</code> straight from this browser, exactly the way the
  GitHub Pages build will. A service only works on Pages if it passes here.
</p>

<button id="run">Run check</button>
<button id="copy" disabled>Copy passing keys</button>

<div id="summary">Idle.</div>
<table id="out"><thead><tr><th>Service</th><th>Key</th><th>Provider</th><th>Result</th><th class="reason">Detail</th></tr></thead><tbody></tbody></table>
<textarea id="json" placeholder="Passing keys appear here after a run." readonly></textarea>

<script>
const CONCURRENCY = 8;
const TIMEOUT_MS = 10000;

const tbody = document.querySelector('#out tbody');
const summaryEl = document.getElementById('summary');
const jsonEl = document.getElementById('json');

async function probe(svc) {
  // No mode:'no-cors' here on purpose. An opaque response would always "succeed"
  // while giving us nothing readable, which is precisely the failure we are testing for.
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
  try {
    const res = await fetch(svc.url, { signal: ctrl.signal, mode: 'cors' });
    if (!res.ok) return { state: 'bad', detail: `HTTP ${res.status}` };
    const data = await res.json();
    const hasStatus = !!(data && (data.status || (data.page && data.page.status)));
    if (!hasStatus) {
      return { state: 'warn', detail: 'CORS ok, but no .status / .page.status — needs an adapter' };
    }
    const ind = (data.status || data.page.status).indicator ?? '?';
    const desc = (data.status || data.page.status).description ?? '?';
    return { state: 'ok', detail: `${ind} — ${desc}` };
  } catch (err) {
    // A CORS rejection surfaces as an opaque TypeError, indistinguishable from a
    // network drop. Both mean unusable from a static page, so both are failures.
    const why = err.name === 'AbortError' ? `timeout after ${TIMEOUT_MS}ms`
              : err instanceof TypeError ? 'blocked by CORS or unreachable'
              : `${err.name}: ${err.message}`;
    return { state: 'bad', detail: why };
  } finally {
    clearTimeout(timer);
  }
}

async function pool(items, worker, limit) {
  const queue = items.slice();
  const runners = Array.from({ length: Math.min(limit, queue.length) }, async () => {
    while (queue.length) await worker(queue.shift());
  });
  await Promise.all(runners);
}

document.getElementById('run').addEventListener('click', async () => {
  tbody.innerHTML = '';
  jsonEl.value = '';
  document.getElementById('run').disabled = true;
  summaryEl.textContent = 'Loading catalog…';

  const catalog = await (await fetch('../services.json')).json();
  const list = catalog.services;
  const counts = { ok: 0, warn: 0, bad: 0 };
  const passing = [];
  let done = 0;

  const paint = () => {
    summaryEl.innerHTML =
      `<strong>${done}</strong>/${list.length} checked &nbsp;·&nbsp; ` +
      `<span class="ok"><strong>${counts.ok}</strong> usable</span> &nbsp;·&nbsp; ` +
      `<span class="warn"><strong>${counts.warn}</strong> needs adapter</span> &nbsp;·&nbsp; ` +
      `<span class="bad"><strong>${counts.bad}</strong> blocked</span>`;
  };
  paint();

  await pool(list, async (svc) => {
    const r = await probe(svc);
    counts[r.state]++;
    if (r.state === 'ok') passing.push(svc.key);
    const tr = document.createElement('tr');
    // textContent throughout — status payloads are third-party data, never markup.
    const cells = [svc.name, svc.key, svc.provider, r.state.toUpperCase(), r.detail];
    cells.forEach((val, i) => {
      const td = document.createElement('td');
      td.textContent = val;
      if (i === 3) td.className = r.state;
      if (i === 4) td.className = 'reason';
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
    done++; paint();
  }, CONCURRENCY);

  passing.sort();
  jsonEl.value = JSON.stringify(passing, null, 2);
  document.getElementById('copy').disabled = false;
  document.getElementById('run').disabled = false;
});

document.getElementById('copy').addEventListener('click', () => {
  jsonEl.select();
  navigator.clipboard.writeText(jsonEl.value);
});
</script>
</body>
</html>
