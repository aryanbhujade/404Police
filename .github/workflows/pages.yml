name: Deploy to GitHub Pages

# The repository root *is* the site — no build step, no bundler, no node_modules.
# The validate job is the gate: it runs the same dependency-free checks a developer
# runs locally, and deploy will not start unless it passes.

on:
  push:
    branches: [github-pages-static]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check JavaScript
        run: |
          node --check app.js
          node --check waves.js

      - name: Validate services.json
        run: node -e "JSON.parse(require('fs').readFileSync('services.json','utf8'))"

      - name: Static validation tests
        run: node --test tests/

      # Network checks only. Third-party status pages have bad days, and a blip at
      # theirs must not block a deploy of ours, so this is advisory.
      - name: Catalog health check (advisory)
        continue-on-error: true
        run: node tools/catalog-health.mjs --supported-only --concurrency 6 --timeout 10000

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Upload repository root
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
